name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs drop stale runs; main queues instead, so a deploy is never cut off mid-migration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:functions

  database:
    name: Database migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Supabase CLI comes from devDependencies, same version as on the dev machine.
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db

  android:
    name: Android APK
    needs: [check, database]
    # Only main ships a build; PRs stop at the checks.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # shortcut: debug-signed release APK for testing on a phone; switch to EAS Build with a
      # real keystore before publishing to the Play Store.
      # arm64 only: every current Android phone; keeps the native build (SQLCipher) short.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: garagem-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  supabase:
    name: Deploy database and functions
    # main applies new migrations and deploys every Edge Function to garagem-dev once the checks
    # and the RLS tests pass. Function settings (verify_jwt, entrypoints) come from config.toml;
    # their secrets (KEKS) stay in the Supabase dashboard and are never touched here.
    # shortcut: points at garagem-dev; add garagem-prod (own secrets, protected environment) at
    # publishing (slice 7).
    needs: [check, database]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: bphuqkvehtmmktuyuxyc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$PROJECT_REF"
      - run: npx supabase db push --yes
      # Bundled by the Supabase API: no Docker needed.
      - run: npx supabase functions deploy --project-ref "$PROJECT_REF" --use-api

  sites:
    name: Publish sites
    # Static files, nothing to build: main publishes both Cloudflare Pages projects. The token
    # only has "Cloudflare Pages: Edit"; Cloudflare gets no access to the repository.
    # After the backend: a page may call a function or column that only exists from this push on.
    needs: [supabase]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: garagem.acttechsoftware.com.br
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          command: pages deploy sites/garagem --project-name garagem --branch main
      - name: acttechsoftware.com.br
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          command: pages deploy sites/acttech --project-name acttech --branch main

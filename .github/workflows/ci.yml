name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:functions

  database:
    name: Database migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Supabase CLI comes from devDependencies, same version as on the dev machine.
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db

  android:
    name: Android APK
    needs: [check, database]
    # Only main ships a build; PRs stop at the checks.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # shortcut: debug-signed release APK for testing on a phone; switch to EAS Build with a
      # real keystore before publishing to the Play Store.
      # arm64 only: every current Android phone; keeps the native build (SQLCipher) short.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: garagem-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
